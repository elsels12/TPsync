function parseCSVToEntries(text){
  text = text.replace(/^\uFEFF/, '').trim();
  text = text.replace(/^```[a-zA-Z]*\n/, '').replace(/\n```$/, '').trim();

  // Try JSON first
  if(text.startsWith('[') || text.startsWith('{')){
    try {
      const parsed = JSON.parse(text);
      if(Array.isArray(parsed)) return parsed;
      if(parsed && Array.isArray(parsed.entries)) return parsed.entries;
    } catch(e){}
  }

  // Detect delimiter: tab, comma, or semicolon
  const firstLine = text.split(/\r?\n/)[0] || '';
  const tabCount = (firstLine.match(/\t/g) || []).length;
  const commaCount = (firstLine.match(/,/g) || []).length;
  const semiCount = (firstLine.match(/;/g) || []).length;
  let delimiter = ',';
  if(tabCount > commaCount && tabCount > semiCount) delimiter = '\t';
  else if(semiCount > commaCount && semiCount > tabCount) delimiter = ';';

  // Full CSV/TSV tokenizer respecting multi-line quotes
  const rows = [];
  let currentRow = [];
  let currentField = '';
  let inQuotes = false;
  let i = 0;

  while(i < text.length){
    const char = text[i];
    if(char === '"'){
      if(inQuotes && text[i + 1] === '"'){
        currentField += '"';
        i += 2;
        continue;
      } else {
        inQuotes = !inQuotes;
        i++;
        continue;
      }
    }
    if(!inQuotes){
      if(char === delimiter){
        currentRow.push(currentField.trim());
        currentField = '';
        i++;
        continue;
      }
      if(char === '\r'){ i++; continue; }
      if(char === '\n'){
        currentRow.push(currentField.trim());
        if(currentRow.some(col => col !== '')) rows.push(currentRow);
        currentRow = [];
        currentField = '';
        i++;
        continue;
      }
    }
    currentField += char;
    i++;
  }
  if(currentField !== '' || currentRow.length > 0){
    currentRow.push(currentField.trim());
    if(currentRow.some(col => col !== '')) rows.push(currentRow);
  }

  if(rows.length === 0) return null;

  const normKey = (s) => String(s || '').toLowerCase().replace(/[\s_\-()（）\[\]【】\/]/g, '');

  // Header detection: check if first row contains known header names or if it's already data
  const isFirstColDate = /^\d{4}[-/]\d{1,2}/.test(rows[0][0]) || (!isNaN(Date.parse(rows[0][0])) && String(rows[0][0]).length >= 8);
  const headerKeywords = ['日時','日付','date','time','登録名','car','場所','track','fl','fr','rl','rr','冷間','温間','cold','hot','気温','路面'];
  const firstRowNorm = rows[0].map(h => normKey(h));
  const hasHeaderRow = !isFirstColDate && firstRowNorm.some(h => headerKeywords.some(kw => h.includes(kw)));

  let hMap = {};
  let startIdx = 1;

  if(hasHeaderRow){
    rows[0].forEach((h, idx) => {
      const k = normKey(h);
      if(k) hMap[k] = idx;
      hMap[h] = idx;
      hMap[h.toLowerCase()] = idx;
    });
  } else {
    // Default column order (standard export without header row)
    startIdx = 0;
    const stdHeaders = ['日時','登録名','場所','路面状況','気温','路面温度','タイム','体感','銘柄_前','銘柄_後','サイズ_前','サイズ_後','冷間_fl','冷間_fr','冷間_rl','冷間_rr','温間_fl','温間_fr','温間_rl','温間_rr','メモ','id'];
    stdHeaders.forEach((h, idx) => {
      hMap[normKey(h)] = idx;
    });
  }

  const getCol = (cols, ...names) => {
    for(const name of names){
      const nk = normKey(name);
      let idx = hMap[nk] !== undefined ? hMap[nk] : (hMap[name] !== undefined ? hMap[name] : hMap[name.toLowerCase()]);
      if(idx !== undefined && idx < cols.length){
        const val = cols[idx].replace(/^["']|["']$/g, '').trim();
        if(val !== '') return val;
      }
    }
    return null;
  };

  const getFloat = (cols, ...names) => {
    const val = getCol(cols, ...names);
    if(val === null) return null;
    const n = parseFloat(val);
    return isNaN(n) ? null : n;
  };

  const normalizeCondition = (val) => {
    if(!val) return 'Dry';
    const s = String(val).trim();
    if(s === 'ドライ' || s.toLowerCase() === 'dry') return 'Dry';
    if(s === 'ハーフウェット' || s.toLowerCase() === 'halfwet') return 'HalfWet';
    if(s === 'ウェット' || s.toLowerCase() === 'wet') return 'Wet';
    if(s === 'ベビーウェット' || s.toLowerCase() === 'babywet') return 'BabyWet';
    return s;
  };

  const entriesList = [];
  for(let r = startIdx; r < rows.length; r++){
    const cols = rows[r];
    if(cols.length < 2) continue;

    const timestamp = getCol(cols, '日時', 'タイムスタンプ', 'timestamp', 'date') || new Date().toISOString();
    const car = getCol(cols, '登録名', '車両', '車両名', '車名', 'car') || 'マイカー';
    const track = getCol(cols, '場所', 'サーキット', 'コース', 'track');
    const condition = normalizeCondition(getCol(cols, '路面状況', '路面状態', '路面', 'コンディション', 'condition'));
    const ambientTemp = getFloat(cols, '気温', '外気温', 'ambientTemp', 'temp');
    const trackTemp = getFloat(cols, '路面温度', '路温', 'trackTemp');
    const lapTime = getCol(cols, 'タイム', 'ラップタイム', 'lapTime', 'lap');
    const feel = getCol(cols, '体感', 'フィーリング', 'feel');
    const tireBrandFront = getCol(cols, '銘柄_前', '銘柄前', 'タイヤ_フロント', 'フロント銘柄', 'タイヤ前', 'Fタイヤ', 'tireBrandFront');
    const tireBrandRear = getCol(cols, '銘柄_後', '銘柄後', 'タイヤ_リア', 'リア銘柄', 'タイヤ後', 'Rタイヤ', 'tireBrandRear');
    const sizeFront = getCol(cols, 'サイズ_前', 'サイズ前', 'サイズ_フロント', 'フロントサイズ', 'Fサイズ', 'sizeFront');
    const sizeRear = getCol(cols, 'サイズ_後', 'サイズ後', 'サイズ_リア', 'リアサイズ', 'Rサイズ', 'sizeRear');
    const notes = getCol(cols, 'メモ', '備考', 'notes');

    // Pressures with rich aliases (spaces, underscores, brackets, etc.)
    let cfl = getFloat(cols, '冷間_FL', '冷間FL', '冷間 FL', '冷間(FL)', '冷_FL', 'FL_冷間', 'cold_FL', 'Cold_FL', 'Cold FL', 'coldFL');
    let cfr = getFloat(cols, '冷間_FR', '冷間FR', '冷間 FR', '冷間(FR)', '冷_FR', 'FR_冷間', 'cold_FR', 'Cold_FR', 'Cold FR', 'coldFR');
    let crl = getFloat(cols, '冷間_RL', '冷間RL', '冷間 RL', '冷間(RL)', '冷_RL', 'RL_冷間', 'cold_RL', 'Cold_RL', 'Cold RL', 'coldRL');
    let crr = getFloat(cols, '冷間_RR', '冷間RR', '冷間 RR', '冷間(RR)', '冷_RR', 'RR_冷間', 'cold_RR', 'Cold_RR', 'Cold RR', 'coldRR');

    let hfl = getFloat(cols, '温間_FL', '温間FL', '温間 FL', '温間(FL)', '温_FL', 'FL_温間', 'hot_FL', 'Hot_FL', 'Hot FL', 'hotFL');
    let hfr = getFloat(cols, '温間_FR', '温間FR', '温間 FR', '温間(FR)', '温_FR', 'FR_温間', 'hot_FR', 'Hot_FR', 'Hot FR', 'hotFR');
    let hrl = getFloat(cols, '温間_RL', '温間RL', '温間 RL', '温間(RL)', '温_RL', 'RL_温間', 'hot_RL', 'Hot_RL', 'Hot RL', 'hotRL');
    let hrr = getFloat(cols, '温間_RR', '温間RR', '温間 RR', '温間(RR)', '温_RR', 'RR_温間', 'hot_RR', 'Hot_RR', 'Hot RR', 'hotRR');

    // Single mode fallback (FL, FR, RL, RR with mode column)
    const modeRaw = getCol(cols, 'モード', 'mode', '状態', '種別');
    if(cfl === null && hfl === null && getFloat(cols, 'FL') !== null){
      const isHot = modeRaw && (modeRaw === '温間' || modeRaw.toLowerCase() === 'hot');
      const fl = getFloat(cols, 'FL');
      const fr = getFloat(cols, 'FR');
      const rl = getFloat(cols, 'RL');
      const rr = getFloat(cols, 'RR');
      if(isHot){
        hfl = fl; hfr = fr; hrl = rl; hrr = rr;
      } else {
        cfl = fl; cfr = fr; crl = rl; crr = rr;
      }
    }

    const hasCold = cfl !== null || cfr !== null || crl !== null || crr !== null;
    const hasHot = hfl !== null || hfr !== null || hrl !== null || hrr !== null;

    entriesList.push({
      id: getCol(cols, 'id', 'ID') || (Date.now() + r + '_' + Math.random().toString(36).slice(2, 7)),

  }

}
function importBackupContent(rawText, sourceName){
  try {
    let cleaned = rawText.replace(/^\uFEFF/, '').trim();
    let imported = null;

    // 1. Try parsing as JSON (handles BOM, array, or object with entries)
    if(cleaned.startsWith('[') || cleaned.startsWith('{')){
      try {
        const parsed = JSON.parse(cleaned);
        if(Array.isArray(parsed)){
          imported = parsed;
        } else if(parsed && Array.isArray(parsed.entries)){
          imported = parsed.entries;
        }
      } catch(jsonErr) {
        // will fallback to CSV
      }
    }

    // 2. Fallback to parsing as CSV
    if(!imported){
      imported = parseCSVToEntries(cleaned);
    }

    if(!imported || !Array.isArray(imported) || imported.length === 0){
      throw new Error('有効なデータが見つかりませんでした。JSONまたはCSVファイルをお確かめください。');
    }

    const importedCars = [...new Set(imported.map(e => e.car || 'マイカー'))];
    showImportConfirmModal(imported, importedCars, sourceName || 'データ');
  } catch(err) {
    alert('読み込みエラー: ' + (err.message || 'データ形式を確認してください'));
  }
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    importBackupContent(reader.result, file.name);
  };
  reader.onerror = ()=>{
    alert('ファイルアクセスエラー: 端末内のファイルを開くことができませんでした');
  };
  reader.readAsText(file, 'utf-8');
}

async function executeImport(imported, newCarName){
  const existingMap = new Map();
  entries.forEach((e, idx) => {
    if(e && e.id) existingMap.set(String(e.id), idx);
  });

  let addedCount = 0;
  let updatedCount = 0;

  imported.forEach((e) => {
    if(!e) return;
    if(newCarName){
      e.car = newCarName;
    } else if(!e.car){
      e.car = 'マイカー';
    }

    const key = e.id ? String(e.id) : '';
    if(!newCarName && key && existingMap.has(key)){
      const targetIdx = existingMap.get(key);
      entries[targetIdx] = e;
      updatedCount++;
    } else {
      if(newCarName && key && existingMap.has(key)){
        e.id = Date.now() + Math.floor(Math.random() * 1000);
      }
      entries.push(e);
      if(e.id) existingMap.set(String(e.id), entries.length - 1);
      addedCount++;
    }
  });

  entries.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

  if(newCarName){
    if(!carList.includes(newCarName)){
      carList.push(newCarName);
    }
    currentCar = newCarName;
  } else {
    imported.forEach(e => {
      if(e && e.car && !carList.includes(e.car)){
        carList.push(e.car);
      }
    });
  }

  persistCars();
  await persistEntries();
  renderCarSelector();
  updateTrackFilterOptions();
  restoreLastSessionDefaults(true);
  restorePressuresForMode(currentMode);
  applyFilters();

  if(newCarName){
    showToast(`${addedCount}件を「${newCarName}」として登録しました`);
  } else {
    if(addedCount > 0 && updatedCount > 0){
      showToast(`${addedCount}件の新規セッションを取得、${updatedCount}件更新しました！`);
    } else if(addedCount > 0 && updatedCount === 0){
      showToast(`${addedCount}件の最新セッションを取得しました！`);
    } else if(updatedCount > 0 && addedCount === 0){
      showToast(`${updatedCount}件のデータを最新に更新しました！`);
    } else {
      showToast('最新の状態です（新しいデータはありません）');
    }
  }
}

function getDeviceId(){
  let id = localStorage.getItem('tire_device_id');
  if(!id){
    id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('tire_device_id', id);
  }
  return id;
}

function generateSessionId(){
  const rand = Math.random().toString(36).slice(2, 9);
  const dev = getDeviceId().slice(-4);
  return `${Date.now()}_${dev}_${rand}`;
}

const GAS_URL_KEY = 'tire_pressure_gas_url';

function getGasUrl(){
  return (localStorage.getItem(GAS_URL_KEY) || '').trim();
}

function setGasUrl(url){
  localStorage.setItem(GAS_URL_KEY, (url || '').trim());
}

async function syncEntryToCloud(entry){
  const gasUrl = getGasUrl();
  if(!gasUrl) return;

  try {
    await fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save', entry: entry })
    });
  } catch (err) {
    console.warn('Background cloud sync failed:', err);
  }
}

async function uploadAllToCloud(){
  const gasUrl = getGasUrl();
  if(!gasUrl){
    showToast('スプレッドシート連携URLを設定してください');
    return;
  }
  if(!entries || entries.length === 0){
    showToast('送信するデータがありません');
    return;
  }
  showToast('スプレッドシートへ送信中...');
  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'bulk_upload', entries: entries })
    });
    const json = await res.json().catch(() => null);
    if(json && json.status === 'ok'){
      if(json.updated > 0 && json.appended > 0){
        showToast(`${json.appended}件新規追加、${json.updated}件更新（重複なし）`);
      } else if(json.updated > 0 && json.appended === 0){
        showToast(`${json.updated}件すべて最新に更新しました（重複なし）`);
      } else {
        showToast(`${json.appended || entries.length}件をスプレッドシートへ送信しました！`);
      }
    } else {
      showToast(`${entries.length}件のデータをスプレッドシートへ送信しました！`);
    }
  } catch(err) {
    console.error(err);
    showToast('送信エラー: ' + err.message);
  }
}

async function quickCloudSync(isSilent){
  const gasUrl = getGasUrl();
  if(!gasUrl){
    if(!isSilent){
      showToast('スプレッドシート連携URLが未設定です。「⇄」から設定してください');
      openMigration();
    }
    return;
  }

  const icons = document.querySelectorAll('.sync-btn-icon');
  icons.forEach(ic => ic.classList.add('spinning'));

  if(!isSilent){
    showToast('最新データを取得中...');
  }

  try {
    const res = await fetch(gasUrl + (gasUrl.includes('?') ? '&' : '?') + 'action=getAll');
    const json = await res.json();
    if(json && json.status === 'ok' && Array.isArray(json.entries)){
      if(json.entries.length === 0){
        if(!isSilent) showToast('スプレッドシートにデータがありませんでした');
      } else {
        await executeImport(json.entries, null);
      }
    } else {
      if(!isSilent) showToast('データの取得に失敗しました');
    }
  } catch(err) {
    console.error('quickCloudSync error:', err);
    if(!isSilent) showToast('更新エラー: ' + err.message);
  } finally {
    icons.forEach(ic => ic.classList.remove('spinning'));
  }
}

async function restoreFromCloud(){

  const gasUrl = getGasUrl();
  if(!gasUrl){
    showToast('スプレッドシート連携URLを設定してください');
    return;
  }
  showToast('スプレッドシートから読み込み中...');
  try {
    const res = await fetch(gasUrl + (gasUrl.includes('?') ? '&' : '?') + 'action=getAll');
    const json = await res.json();
    if(json && json.status === 'ok' && Array.isArray(json.entries)){
      if(json.entries.length === 0){
        showToast('スプレッドシートにデータがありませんでした');
        return;
      }
      executeImport(json.entries, null);
      showToast(`スプレッドシートから${json.entries.length}件を同期・復元しました！`);
    } else {
      showToast('データの取得に失敗しました');
    }
  } catch(err) {
    console.error(err);
    showToast('同期エラー: ' + err.message);
  }
}

function saveEntry(){
  try{
    const cornerVals = {};
    ['FL','FR','RL','RR'].forEach(c=>{
      const v = getCornerValue(c);
      cornerVals[c] = isNaN(v) ? null : v;
    });

    const hasAny = Object.values(cornerVals).some(v => v !== null);
    if(!hasAny){
      showToast('圧力を入力してください');
      return;
    }

    const now = new Date();
    const trackVal = document.getElementById('track').value.trim() || null;
    const brandFVal = document.getElementById('tireBrandFront').value.trim() || null;
    const brandRVal = document.getElementById('tireBrandRear').value.trim() || null;
    const sizeFVal = buildTireSize('Front');
    const sizeRVal = buildTireSize('Rear');
    const condVal = document.getElementById('condition').value;
    const ambVal = (()=>{ const v = getCornerValue('ambientTemp'); return isNaN(v) ? null : v; })();
    const trkTempVal = (()=>{ const v = getCornerValue('trackTemp'); return isNaN(v) ? null : v; })();
    const feelVal = document.getElementById('feel').value || null;
    const lapVal = buildLapTime();
    const notesVal = document.getElementById('notes').value.trim() || null;

    const carEntries = getCarEntries();
    const BUNDLE_WINDOW_MS = 12 * 60 * 60 * 1000; // 12時間枠
    let matchingSession = null;

    const container = document.getElementById('bundleNoticeContainer');
    const isPopupVisible = container && container.style.display !== 'none';

    let chosenType = 'separate';
    if(isPopupVisible){
      const saveTypeRadios = document.getElementsByName('saveSessionType');
      for(let r of saveTypeRadios){
        if(r.checked){ chosenType = r.value; break; }
      }
    } else {
      chosenType = 'separate';
    }

    // 結合判定：ポップアップが表示されていてユーザーが「まとめる (bundle)」を選んだ場合のみ直前セッションと統合
    if(isPopupVisible && chosenType === 'bundle' && carEntries.length > 0){
      const latest = carEntries[0];
      const diff = now.getTime() - new Date(latest.timestamp).getTime();
      if(diff >= 0 && diff < BUNDLE_WINDOW_MS){
        const hasC = latest.coldPressures && Object.values(latest.coldPressures).some(v => v !== null && v !== undefined);
        const hasH = latest.hotPressures && Object.values(latest.hotPressures).some(v => v !== null && v !== undefined);

        if(currentMode === 'hot' && hasC && !hasH){
          matchingSession = latest;
        } else if(currentMode === 'cold' && !hasC && hasH){
          matchingSession = latest;
        }
      }
    }

    let savedEntry = null;
    if(matchingSession){
      savedEntry = matchingSession;
      if(currentMode === 'hot'){
        matchingSession.hotPressures = cornerVals;
        if(ambVal !== null) matchingSession.ambientTemp = ambVal;
        if(trkTempVal !== null) matchingSession.trackTemp = trkTempVal;
        if(lapVal) matchingSession.lapTime = lapVal;
        if(feelVal) matchingSession.feel = feelVal;
        if(trackVal) matchingSession.track = trackVal;
        if(brandFVal) matchingSession.tireBrandFront = brandFVal;
        if(brandRVal) matchingSession.tireBrandRear = brandRVal;
        if(sizeFVal) matchingSession.sizeFront = sizeFVal;
        if(sizeRVal) matchingSession.sizeRear = sizeRVal;
        if(condVal) matchingSession.condition = condVal;
        if(notesVal){
          matchingSession.notes = matchingSession.notes ? (matchingSession.notes + ' / ' + notesVal) : notesVal;
        }
        showToast('前回の冷間カードに温間を追加しました');
      } else {
        matchingSession.coldPressures = cornerVals;
        if(ambVal !== null && matchingSession.ambientTemp === null) matchingSession.ambientTemp = ambVal;
        if(trkTempVal !== null && matchingSession.trackTemp === null) matchingSession.trackTemp = trkTempVal;
        if(trackVal && !matchingSession.track) matchingSession.track = trackVal;
        if(brandFVal && !matchingSession.tireBrandFront) matchingSession.tireBrandFront = brandFVal;
        if(brandRVal && !matchingSession.tireBrandRear) matchingSession.tireBrandRear = brandRVal;
        if(sizeFVal && !matchingSession.sizeFront) matchingSession.sizeFront = sizeFVal;
        if(sizeRVal && !matchingSession.sizeRear) matchingSession.sizeRear = sizeRVal;
        if(condVal && !matchingSession.condition) matchingSession.condition = condVal;
        if(notesVal){
          matchingSession.notes = matchingSession.notes ? (matchingSession.notes + ' / ' + notesVal) : notesVal;
        }
        showToast('前回の温間カードに冷間を追加しました');
      }
    } else {
      const newEntry = {
        id: generateSessionId(),
        deviceId: getDeviceId(),
        timestamp: now.toISOString(),
        car: currentCar,
        coldPressures: currentMode === 'cold' ? cornerVals : null,
        hotPressures: currentMode === 'hot' ? cornerVals : null,
        ambientTemp: ambVal,
        trackTemp: trkTempVal,
        condition: condVal,
        track: trackVal,
        tireBrandFront: brandFVal,
        tireBrandRear: brandRVal,
        sizeFront: sizeFVal,
        sizeRear: sizeRVal,
        feel: feelVal,
        lapTime: lapVal,
        notes: notesVal
      };
      entries.unshift(newEntry);
      savedEntry = newEntry;
      showToast(currentMode === 'cold' ? '冷間セッションを新規記録しました' : '温間セッションを新規記録しました');
    }

    persistEntries();
    syncEntryToCloud(savedEntry);
    updateTrackFilterOptions();
    applyFilters();
    updateSessionBundleNotice();

    // preserve corner inputs across sessions
    checkBalance();
    document.getElementById('notes').value = '';
    ['lapMin','lapSec','lapHund'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('feel').value = '';
    clearTemp('ambientTemp');
    clearTemp('trackTemp');
  } catch(err){
    console.error('Error in saveEntry:', err);
    showToast('記録エラー: ' + err.message);
  }
}

function updateTrackFilterOptions(){
  const allEntries = entries;
  const carEntries = getCarEntries();

  // Track history from all entries
  trackHistory = [...new Set(allEntries.map(e=>e.track).filter(Boolean))].sort();
  const filterTrack = document.getElementById('filterTrack');
  const currentTrack = filterTrack.value;
  filterTrack.innerHTML = '<option value="">すべて</option>' + trackHistory.map(t=>`<option value="${t}">${t}</option>`).join('');
  if(trackHistory.includes(currentTrack)) filterTrack.value = currentTrack;

  // Tire brand history from all entries
  tireBrandHistory = [...new Set([
    ...allEntries.map(e=>e.tireBrandFront).filter(Boolean),
    ...allEntries.map(e=>e.tireBrandRear).filter(Boolean)
  ])].sort();
  const filterBrand = document.getElementById('filterTireBrand');
  const currentBrand = filterBrand.value;
  filterBrand.innerHTML = '<option value="">すべて</option>' + tireBrandHistory.map(b=>`<option value="${b}">${b}</option>`).join('');

  // Tire size history from all entries
  sizeHistory = [...new Set([
    ...allEntries.map(e=>e.sizeFront).filter(Boolean),
    ...allEntries.map(e=>e.sizeRear).filter(Boolean)
  ])].sort();

  renderSizePresets();
}

function renderSizePresets(){

function onTempInput(idPrefix){
  const sel = document.getElementById(idPrefix + '-select');
  const input = document.getElementById(idPrefix);
  if(!input || !sel) return;
  const val = input.value.trim();
  if(val === ''){
    sel.value = '';
    return;
  }
  const num = parseFloat(val);
  if(!isNaN(num)){
    let opt = Array.from(sel.options).find(o => parseFloat(o.value) === num);
    if(!opt){
      opt = document.createElement('option');
      opt.value = String(num);
      opt.textContent = `${num}℃`;
      sel.appendChild(opt);
    }
    sel.value = opt.value;
  }
}

function setupTrackAutocomplete(){

  const input = document.getElementById('track');
  const listEl = document.getElementById('track-suggest');

  function render(showAll = false){
    const q = showAll ? '' : input.value.trim().toLowerCase();
    const history = trackHistory;
    const matches = q === '' ? history : history.filter(v => v.toLowerCase().includes(q));
    if(matches.length === 0){
      listEl.classList.remove('show');
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = matches.slice(0, 10).map(v => `<div class="autocomplete-item">${v}</div>`).join('');
    listEl.classList.add('show');
  }

  // Tapping clears the input and shows all past track candidates
  input.addEventListener('focus', () => {
    input.value = '';
    render(true);
  });
  input.addEventListener('input', () => render(false));

  document.addEventListener('pointerdown', (e) => {
    if(!input.contains(e.target) && !listEl.contains(e.target)){
      listEl.classList.remove('show');
    }
  });

  const selectItem = (e) => {
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    e.stopPropagation();
    input.value = item.textContent;
    input.dispatchEvent(new Event('input'));
    listEl.classList.remove('show');
    input.blur();
  };
  listEl.addEventListener('pointerdown', selectItem);
  listEl.addEventListener('mousedown', selectItem);
}

let tireLinkActive = true;

function setupTireBrandAutocomplete(){
  const frontInput = document.getElementById('tireBrandFront');
  const rearInput = document.getElementById('tireBrandRear');
  const frontList = document.getElementById('tireBrandFront-suggest');
  const rearList = document.getElementById('tireBrandRear-suggest');

  function render(listEl, currentVal, showAll = false){
    const q = showAll ? '' : currentVal.trim().toLowerCase();
    const history = tireBrandHistory;
    const matches = q === '' ? history : history.filter(v => v.toLowerCase().includes(q));
    if(matches.length === 0){
      listEl.classList.remove('show');
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = matches.slice(0, 10).map(v => `<div class="autocomplete-item">${v}</div>`).join('');
    listEl.classList.add('show');
  }

  // Tapping Front
  const handleFrontTap = () => {
    // If currently linked (both equal and non-empty), tapping Front means user wants to edit Front separately
    if(tireLinkActive && frontInput.value !== '' && frontInput.value === rearInput.value){
      tireLinkActive = false;
      frontInput.value = '';
    } else if(!tireLinkActive && frontInput.value !== ''){
      frontInput.value = '';
    }
    render(frontList, frontInput.value, true);
  };
  frontInput.addEventListener('focus', handleFrontTap);

  // Tapping Rear
  const handleRearTap = () => {
    // If currently linked (both equal and non-empty), tapping Rear means user wants to edit Rear separately
    if(tireLinkActive && rearInput.value !== '' && frontInput.value === rearInput.value){
      tireLinkActive = false;
      rearInput.value = '';
    } else if(!tireLinkActive && rearInput.value !== ''){
      rearInput.value = '';
    }
    render(rearList, rearInput.value, true);
  };
  rearInput.addEventListener('focus', handleRearTap);

  // Typing in Front
  frontInput.addEventListener('input', () => {
    // If linked, or if rear is empty, or if user types matching value: sync to rear!
    if(tireLinkActive || rearInput.value === '' || frontInput.value === rearInput.value){
      rearInput.value = frontInput.value;
      tireLinkActive = true;
    }
    render(frontList, frontInput.value, false);
  });

  // Typing in Rear
  rearInput.addEventListener('input', () => {
    // If linked, or if front is empty, or if user types matching value: sync to front!
    if(tireLinkActive || frontInput.value === '' || frontInput.value === rearInput.value){
      frontInput.value = rearInput.value;
      tireLinkActive = true;
    }
    render(rearList, rearInput.value, false);
  });

  // Selecting from Front suggestions
  const selectFrontItem = (e) => {
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    e.stopPropagation();
    const val = item.textContent;
    frontInput.value = val;
    // If linked or rear is empty: sync to rear!
    if(tireLinkActive || rearInput.value === ''){
      rearInput.value = val;
      tireLinkActive = true;
    }
    frontList.classList.remove('show');
    frontInput.blur();
  };
  frontList.addEventListener('pointerdown', selectFrontItem);
  frontList.addEventListener('mousedown', selectFrontItem);

  // Selecting from Rear suggestions
  const selectRearItem = (e) => {
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    e.stopPropagation();
    const val = item.textContent;
    rearInput.value = val;
    // If linked or front is empty: sync to front!
    if(tireLinkActive || frontInput.value === ''){
      frontInput.value = val;
      tireLinkActive = true;
    }
    rearList.classList.remove('show');
    rearInput.blur();
  };
  rearList.addEventListener('pointerdown', selectRearItem);
  rearList.addEventListener('mousedown', selectRearItem);

  document.addEventListener('pointerdown', (e) => {
    if(!frontInput.contains(e.target) && !frontList.contains(e.target)){
      frontList.classList.remove('show');
    }
    if(!rearInput.contains(e.target) && !rearList.contains(e.target)){
      rearList.classList.remove('show');
    }
  });
}

let isScrolledDown = false;
function updateJumpButtons(){
  const scrollY = window.scrollY || window.pageYOffset || 0;
  const historyEl = document.getElementById('logSectionAnchor') || document.getElementById('logList');
  const historyTop = historyEl ? historyEl.offsetTop - 350 : 600;
  isScrolledDown = scrollY > historyTop;

  const stickyIcon = document.getElementById('stickyJumpIcon');
  const stickyTxt = document.getElementById('stickyJumpTxt');
  const topbarBtn = document.getElementById('topbarJumpBtn');

  if(isScrolledDown){
    if(stickyIcon) stickyIcon.textContent = '⬆';
    if(stickyTxt) stickyTxt.textContent = '入力';
    if(topbarBtn) topbarBtn.textContent = '⬆ 入力';
  } else {
    if(stickyIcon) stickyIcon.textContent = '⬇';
    if(stickyTxt) stickyTxt.textContent = '履歴';
    if(topbarBtn) topbarBtn.textContent = '⬇ 履歴';
  }
}

function toggleScrollJump(){
  if(isScrolledDown){
    scrollToTop();
  } else {
    scrollToHistory();
  }
}

      <div style="margin-bottom:14px;">
        <button type="button" onclick="splitSession('${entry.id}')" style="width:100%;padding:10px 0;background:rgba(255,182,39,0.1);color:var(--amber);border:1px solid var(--amber);border-radius:8px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">
          ✂️ 冷間と温間を2つの別々カードに分割する
        </button>
      </div>
    ` : ''}
    ${(!entry.coldPressures && entry.hotPressures && findColdMatch(entry)) ? `
      <div style="margin-bottom:14px;">
        <button type="button" onclick="bundleWithEarlierCold('${entry.id}')" style="width:100%;padding:10px 0;background:rgba(255,182,39,0.1);color:var(--amber);border:1px solid var(--amber);border-radius:8px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">
          🔗 直前の冷間カードと1つにまとめる（結合）
        </button>
      </div>
    ` : ''}
    <div style="display:flex;gap:10px;">
      <button id="saveEditBtn" style="flex:1;padding:12px 0;background:var(--amber);color:#1a1400;border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.05em;cursor:pointer;">
        更新して保存
      </button>
      <button id="cancelEditBtn" style="flex:1;padding:12px 0;background:transparent;color:#9aa0a8;border:1px solid #2b3038;border-radius:8px;font-family:'Oswald',sans-serif;font-size:14px;cursor:pointer;">
        キャンセル
      </button>
    </div>
  `;

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  document.getElementById('cancelEditBtn').onclick = () => {
    document.body.removeChild(overlay);
  };

  document.getElementById('saveEditBtn').onclick = () => {
    // Read Cold Pressures
    const cfl = parseFloat(document.getElementById('editColdFL').value);
    const cfr = parseFloat(document.getElementById('editColdFR').value);
    const crl = parseFloat(document.getElementById('editColdRL').value);
    const crr = parseFloat(document.getElementById('editColdRR').value);
    const hasCold = !isNaN(cfl) || !isNaN(cfr) || !isNaN(crl) || !isNaN(crr);
    entry.coldPressures = hasCold ? {
      FL: isNaN(cfl) ? null : cfl,
      FR: isNaN(cfr) ? null : cfr,
      RL: isNaN(crl) ? null : crl,
      RR: isNaN(crr) ? null : crr
    } : null;

    // Read Hot Pressures
    const hfl = parseFloat(document.getElementById('editHotFL').value);
    const hfr = parseFloat(document.getElementById('editHotFR').value);
    const hrl = parseFloat(document.getElementById('editHotRL').value);
    const hrr = parseFloat(document.getElementById('editHotRR').value);
    const hasHot = !isNaN(hfl) || !isNaN(hfr) || !isNaN(hrl) || !isNaN(hrr);
    entry.hotPressures = hasHot ? {
      FL: isNaN(hfl) ? null : hfl,
      FR: isNaN(hfr) ? null : hfr,
      RL: isNaN(hrl) ? null : hrl,
      RR: isNaN(hrr) ? null : hrr
    } : null;

    entry.track = document.getElementById('editTrack').value.trim() || null;
    entry.tireBrandFront = document.getElementById('editTireBrandFront').value.trim() || null;
    entry.tireBrandRear = document.getElementById('editTireBrandRear').value.trim() || null;
    entry.sizeFront = document.getElementById('editSizeFront').value.trim() || null;
    entry.sizeRear = document.getElementById('editSizeRear').value.trim() || null;

    const amb = parseFloat(document.getElementById('editAmbientTemp').value);
    entry.ambientTemp = isNaN(amb) ? null : amb;
    const trk = parseFloat(document.getElementById('editTrackTemp').value);
    entry.trackTemp = isNaN(trk) ? null : trk;

    entry.condition = document.getElementById('editCondition').value;
    entry.feel = document.getElementById('editFeel').value || null;
    entry.lapTime = document.getElementById('editLapTime').value.trim() || null;
    entry.notes = document.getElementById('editNotes').value.trim() || null;

    persistEntries();
    updateTrackFilterOptions();
    applyFilters();
    document.body.removeChild(overlay);
    showToast('記録を更新しました');
  };
}

function confirmDelete(id){
  if(confirm('この記録を削除しますか？')){
    deleteEntry(id);
  }
}

function deleteEntry(id){
  entries = entries.filter(e => String(e.id) !== String(id));
  persistEntries();
  updateTrackFilterOptions();
  applyFilters();
}

loadEntries();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=1.04').catch(() => {});
  });
}
</script>

</body>
</html>
